# 方案 A：静态站 + 定时采集
# GitHub Actions 定时运行 fetch_market_data.py 生成 data.json，仅在内容变化时提交回仓库；
# 前端为纯静态文件，由 GitHub Pages 发布，浏览器/手机同源读取 data.json，不直连行情源（无 CORS 问题）。
#
# cron 为 UTC 时间，换算北京时间 = UTC+8：
#   30 1 * * 1-5  -> 工作日 北京 09:30（沪金早盘后）
#   30 9 * * 1-5  -> 工作日 北京 17:30（沪金收盘后、美股盘前）
# 周末与节假日不跑；脚本对每个源独立容错，个别源失败不影响整体，前端对应字段显示 --。
name: fetch-gold-data

on:
  schedule:
    - cron: "30 1 * * 1-5"
    - cron: "30 9 * * 1-5"
  workflow_dispatch: {}   # 允许在 Actions 页手动点 Run workflow 立即采集一次

permissions:
  contents: write

concurrency:
  group: fetch-gold-data
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run market data collector (stdlib only)
        run: python3 fetch_market_data.py --timeout 20

      - name: Commit updated data.json if changed
        run: |
          git config user.name "gold-bot"
          git config user.email "gold-bot@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "data.json unchanged, nothing to commit."
          else
            git commit -m "chore(data): refresh market data"
            git push
          fi
